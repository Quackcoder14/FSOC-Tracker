services:
  # Backend - Python Web Service
  - type: web
    name: fsoc-tracker-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python main.py --host 0.0.0.0 --port 8765 --http-port 8766
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
    plan: free
